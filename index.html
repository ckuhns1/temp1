<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koch Snowflake</title>
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --text: #1d2433;
    --muted: #5b6475;
    --accent: #2f6fe4;
    --fill: rgba(47, 111, 228, 0.10);
    --border: #dde1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1220;
      --panel: #161b2c;
      --text: #e6e9f2;
      --muted: #9aa3b8;
      --accent: #7fb0ff;
      --fill: rgba(127, 176, 255, 0.12);
      --border: #2a3147;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1220;
    --panel: #161b2c;
    --text: #e6e9f2;
    --muted: #9aa3b8;
    --accent: #7fb0ff;
    --fill: rgba(127, 176, 255, 0.12);
    --border: #2a3147;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
  }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  .stage {
    width: 100%;
    max-width: 720px;
    aspect-ratio: 1 / 1;
    max-height: calc(100vh - 190px);
    min-height: 260px;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .stage { position: relative; }
  .stats {
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .stats b { color: var(--text); font-weight: 600; }
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; max-width: 100%;
  }
  button {
    font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  input[type="range"] { accent-color: var(--accent); width: 110px; }
</style>
</head>
<body>
  <h1>Koch Snowflake</h1>
  <div class="stage"><canvas id="c"></canvas></div>
  <div class="stats">
    <span>Iteration <b id="lvl">0</b></span>
    <span>Segments <b id="segs">3</b></span>
    <span>Perimeter <b id="per">1.000</b>× initial</span>
    <span>Zoom <b id="zoom">1</b>×</span>
  </div>
  <div class="controls">
    <button id="play" class="primary">Pause</button>
    <button id="step">Step</button>
    <button id="reset">Reset</button>
    <label>Max iterations <input id="max" type="range" min="1" max="12" value="10"><span id="maxv">10</span></label>
    <label>Speed <input id="speed" type="range" min="1" max="10" value="5"></label>
  </div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const ui = {
    lvl: document.getElementById("lvl"),
    segs: document.getElementById("segs"),
    per: document.getElementById("per"),
    zoom: document.getElementById("zoom"),
    play: document.getElementById("play"),
    step: document.getElementById("step"),
    reset: document.getElementById("reset"),
    max: document.getElementById("max"),
    maxv: document.getElementById("maxv"),
    speed: document.getElementById("speed"),
  };

  const SIN60 = Math.sqrt(3) / 2;
  const HOLD_MS = 700;
  const ZOOM_OUT_MS_PER_STEP = 450; // zoom-out time per factor of 3
  // Zooming starts with iteration 7. During that iteration the view zooms in
  // by 3^ZOOM_FIRST so the new bumps become visible, then by 3× per iteration
  // so each new generation of bumps appears at the same on-screen size.
  const ZOOM_FROM = 6;
  const ZOOM_FIRST = 3;

  // Equilateral triangle in unit coordinates, centred on the origin.
  // Vertices run clockwise on screen (y down), so the Koch bumps point outward.
  const TRI = [0, 1, 2].map(i => {
    const a = -Math.PI / 2 + i * (2 * Math.PI / 3);
    return [Math.cos(a), Math.sin(a)];
  });

  // A point on the limit curve of the first edge, `u` of the way along it
  // (measured in Koch-curve parameter). This is where the camera zooms in; an
  // irrational `u` keeps the local shape changing from one depth to the next.
  const TARGET = (() => {
    let [ax, ay] = TRI[0], [bx, by] = TRI[1], u = (Math.sqrt(5) - 1) / 2;
    for (let i = 0; i < 40; i++) {
      const dx = (bx - ax) / 3, dy = (by - ay) / 3;
      const pts = [
        [ax, ay], [ax + dx, ay + dy],
        [ax + 1.5 * dx + dy * SIN60, ay + 1.5 * dy - dx * SIN60],
        [ax + 2 * dx, ay + 2 * dy], [bx, by],
      ];
      const k = Math.min(3, Math.floor(u * 4));
      u = u * 4 - k;
      [ax, ay] = pts[k];
      [bx, by] = pts[k + 1];
    }
    return [ax, ay];
  })();

  // Current view transform (screen = o + world * s) and clip rectangle,
  // shared with seg() to keep the recursion cheap.
  let ox = 0, oy = 0, vs = 1, clipX0 = 0, clipY0 = 0, clipX1 = 0, clipY1 = 0, lod = 1, bumpT = 1;

  // Draw one Koch edge A→B refined `n` more times. The deepest level's bumps
  // are scaled by bumpT so they can grow in. Edges that are off screen or
  // shorter than `lod` pixels are drawn as a straight chord; the Koch curve
  // over an edge stays within a disc of radius |AB|/2 about its midpoint,
  // so culled chords never cross the visible area.
  function seg(ax, ay, bx, by, n) {
    const sbx = ox + bx * vs, sby = oy + by * vs;
    if (n > 0) {
      const sax = ox + ax * vs, say = oy + ay * vs;
      const len = Math.hypot(sbx - sax, sby - say);
      const mx = (sax + sbx) / 2, my = (say + sby) / 2, r = len * 0.55;
      if (len >= lod && mx + r > clipX0 && mx - r < clipX1 && my + r > clipY0 && my - r < clipY1) {
        const dx = (bx - ax) / 3, dy = (by - ay) / 3;
        const h = SIN60 * (n === 1 ? bumpT : 1);
        const p1x = ax + dx, p1y = ay + dy, p2x = ax + 2 * dx, p2y = ay + 2 * dy;
        const px = ax + 1.5 * dx + dy * h, py = ay + 1.5 * dy - dx * h;
        seg(ax, ay, p1x, p1y, n - 1);
        seg(p1x, p1y, px, py, n - 1);
        seg(px, py, p2x, p2y, n - 1);
        seg(p2x, p2y, bx, by, n - 1);
        return;
      }
    }
    ctx.lineTo(sbx, sby);
  }

  function snowflakePath(depth, t) {
    bumpT = t;
    ctx.beginPath();
    ctx.moveTo(ox + TRI[0][0] * vs, oy + TRI[0][1] * vs);
    for (let i = 0; i < 3; i++) {
      const a = TRI[i], b = TRI[(i + 1) % 3];
      seg(a[0], a[1], b[0], b[1], depth);
    }
    ctx.closePath();
  }

  // Zoom exponent (base 3) as a function of the continuous iteration count.
  function zoomExp(x) {
    if (x <= ZOOM_FROM) return 0;
    if (x <= ZOOM_FROM + 1) return (x - ZOOM_FROM) * ZOOM_FIRST;
    return ZOOM_FIRST + (x - ZOOM_FROM - 1);
  }

  // Animation state: `level` is the completed iteration, `progress` (0..1)
  // is how far the next iteration's bumps have grown, and `zoomOut` (0..1)
  // is how far the camera has pulled back after the last iteration.
  let level = 0, progress = 0, zoomOut = 0, playing = true, hold = HOLD_MS, last = performance.now();

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2; }
  function maxLevel() { return +ui.max.value; }

  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    draw();
  }

  function draw() {
    const w = canvas.width, h = canvas.height;
    const dpr = window.devicePixelRatio || 1;
    const accent = css("--accent"), fill = css("--fill");
    ctx.clearRect(0, 0, w, h);

    const t = easeInOut(progress);
    const depth = progress > 0 ? level + 1 : level;
    const zexp = zoomExp(level + t) * (1 - easeInOut(zoomOut));
    const z = 3 ** zexp;

    // Zoom about the target, gliding it from its unzoomed screen position to
    // the centre over the first zoom step and keeping it centred after that.
    const base = Math.min(w, h) / 2 / 1.06;
    const f = easeInOut(Math.min(1, zexp / ZOOM_FIRST));
    vs = base * z;
    ox = w / 2 + TARGET[0] * (base * (1 - f) - vs);
    oy = h / 2 + TARGET[1] * (base * (1 - f) - vs);
    const cx = (w / 2 - ox) / vs, cy = (h / 2 - oy) / vs;
    clipX0 = -4; clipY0 = -4; clipX1 = w + 4; clipY1 = h + 4;
    lod = dpr;

    snowflakePath(depth, progress > 0 ? t : 1);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(1, dpr * (z > 1 || level >= 4 ? 1.5 : 2));
    ctx.strokeStyle = accent;
    ctx.stroke();

    if (zexp > 0.01) drawInset(w, h, dpr, depth, cx, cy, accent, fill);

    ui.lvl.textContent = depth;
    ui.segs.textContent = (3 * 4 ** depth).toLocaleString();
    ui.per.textContent = ((4 / 3) ** depth).toFixed(3);
    ui.zoom.textContent = z < 10 ? z.toFixed(1) : Math.round(z).toLocaleString();
  }

  // Overview of the whole snowflake with the zoomed region marked.
  function drawInset(w, h, dpr, depth, cx, cy, accent, fill) {
    const mainS = vs, mainOx = ox, mainOy = oy;
    const size = Math.round(Math.min(130 * dpr, Math.min(w, h) * 0.3));
    const x0 = 8 * dpr, y0 = 8 * dpr;

    ctx.save();
    ctx.fillStyle = css("--panel");
    ctx.strokeStyle = css("--border");
    ctx.lineWidth = dpr;
    ctx.fillRect(x0, y0, size, size);
    ctx.strokeRect(x0 + 0.5, y0 + 0.5, size - 1, size - 1);

    vs = size / 2 / 1.12;
    ox = x0 + size / 2;
    oy = y0 + size / 2;
    clipX0 = x0; clipY0 = y0; clipX1 = x0 + size; clipY1 = y0 + size;
    lod = 1.5 * dpr;
    snowflakePath(Math.min(depth, 5), 1);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = dpr;
    ctx.stroke();

    // Visible region of the main view, in inset coordinates.
    const rw = (w / mainS) * vs, rh = (h / mainS) * vs;
    const rx = ox + cx * vs, ry = oy + cy * vs;
    ctx.strokeStyle = css("--text");
    ctx.lineWidth = 1.5 * dpr;
    ctx.strokeRect(rx - rw / 2, ry - rh / 2, rw, rh);
    if (rw < 10 * dpr) {
      ctx.beginPath();
      ctx.arc(rx, ry, 6 * dpr, 0, 2 * Math.PI);
      ctx.stroke();
    }
    ctx.restore();

    vs = mainS; ox = mainOx; oy = mainOy;
  }

  function advance(dt) {
    if (hold > 0) { hold -= dt; return; }
    if (level >= maxLevel()) {
      // Pull the camera back out, then start over.
      const steps = zoomExp(level);
      if (steps > 0 && zoomOut < 1) {
        zoomOut = Math.min(1, zoomOut + dt / (ZOOM_OUT_MS_PER_STEP * steps));
        if (zoomOut >= 1) hold = HOLD_MS * 1.5;
        return;
      }
      level = 0; progress = 0; zoomOut = 0; hold = HOLD_MS;
      return;
    }
    progress += dt * +ui.speed.value / 2600;
    if (progress >= 1) {
      level++; progress = 0;
      // Linger longer on the finished snowflake.
      hold = level >= maxLevel() ? HOLD_MS * 3 : HOLD_MS;
    }
  }

  function frame(now) {
    const dt = Math.min(now - last, 100);
    last = now;
    if (playing) { advance(dt); draw(); }
    requestAnimationFrame(frame);
  }

  function setPlaying(on) {
    playing = on;
    ui.play.textContent = on ? "Pause" : "Play";
    ui.play.classList.toggle("primary", on);
  }

  ui.play.addEventListener("click", () => setPlaying(!playing));
  ui.step.addEventListener("click", () => {
    setPlaying(false);
    hold = 0;
    if (progress > 0) { level++; progress = 0; }
    else if (level < maxLevel() && zoomOut === 0) level++;
    else { level = 0; zoomOut = 0; }
    draw();
  });
  ui.reset.addEventListener("click", () => {
    level = 0; progress = 0; zoomOut = 0; hold = HOLD_MS;
    draw();
  });
  ui.max.addEventListener("input", () => {
    ui.maxv.textContent = ui.max.value;
    if (level > maxLevel()) { level = maxLevel(); progress = 0; zoomOut = 0; draw(); }
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  new ResizeObserver(resize).observe(canvas);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
